services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-user/wattmagent}:${TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - llm_cache:/home/app/.cache/llm

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]
    restart: unless-stopped

volumes:
  llm_cache:
  caddy_data:
