# Alert rules for WattMagent. The thresholds are starting points, not measured values: tune them
# on real traffic. Logic is unit-tested in alerts_test.yml (run by CI with promtool).
groups:
  - name: wattmagent
    rules:
      - alert: ApiDown
        expr: up{job="wattmagent"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The API does not answer scrapes.

      - alert: FallbackRateHigh
        expr: >-
          sum(rate(wattmagent_plan_results_total{decision="fallback"}[1h]))
          / sum(rate(wattmagent_plan_results_total{status="planned"}[1h])) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: More than 10% of plans use the safe fallback (stale prices, or optimiser or verifier trouble).

      - alert: PricesStale
        expr: wattmagent_price_age_hours > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Prices are older than 30 h; the freshness limit is 36 h, after which plans fall back.

      - alert: ServerErrors
        expr: sum(rate(wattmagent_http_requests_total{status=~"5.."}[5m])) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: The API has been returning 5xx errors for 10 minutes.

      - alert: SlowPlans
        expr: >-
          histogram_quantile(0.95, sum by (le)
          (rate(wattmagent_http_request_duration_seconds_bucket{route="/v1/plans"}[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The 95th percentile of plan requests is above 2 s (solver or price refresh slow).

      - alert: AuthFailuresSpike
        expr: rate(wattmagent_auth_failures_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than one refused login per second; a client has a wrong key or someone is guessing.
