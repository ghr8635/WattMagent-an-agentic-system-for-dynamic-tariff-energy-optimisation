# Ready-made appliances. EVERY NUMBER HERE IS AN ILLUSTRATIVE ASSUMPTION, not a measurement
# of any product. Replace with your own device's figures for a real household.
#
# To add an appliance: add a table below (or put the same table under [catalogue.*] in a
# household file). No code change is needed.

# ---- shiftable cycles: profile_kw is the average power in each consecutive hour ----------

[cycle.washing_machine]
description = "Washing machine, 40 C cotton, about 1.4 kWh"
profile_kw = [0.9, 0.5]

[cycle.dishwasher]
description = "Dishwasher, eco programme, about 1.05 kWh over three hours"
profile_kw = [0.55, 0.25, 0.25]

[cycle.tumble_dryer_heat_pump]
description = "Heat-pump tumble dryer, about 1.9 kWh over three hours"
profile_kw = [0.7, 0.7, 0.5]

[cycle.tumble_dryer_condenser]
description = "Condenser tumble dryer, about 3.9 kWh over three hours"
profile_kw = [1.6, 1.6, 0.7]

# ---- hot-water tanks ---------------------------------------------------------------------
# draw_shape: 24 relative weights, local clock hour 0..23. daily_draw_kwh is the thermal
# energy taken out of the tank per day: 4 kWh is about 76 l of water heated from 10 C to
# 55 C (4 / (0.001163 x 45)), a modest household figure.

[tank.water_heater_200l]
description = "200 l electric water heater, 3 kW element, band 45-60 C"
volume_l = 200.0
power_kw = 3.0
t_min_c = 45.0
t_max_c = 60.0
t_initial_c = 52.0
ambient_c = 20.0
loss_kw_per_k = 0.0019
daily_draw_kwh = 4.0
draw_shape = [0, 0, 0, 0, 0, 0.5, 3, 4, 2, 1, 0.5, 0.5, 1, 0.5, 0.5, 0.5, 1, 2, 3, 3.5, 2.5, 1.5, 0.5, 0]

[tank.water_heater_80l]
description = "80 l electric boiler, 2 kW element, band 45-65 C"
volume_l = 80.0
power_kw = 2.0
t_min_c = 45.0
t_max_c = 65.0
t_initial_c = 55.0
ambient_c = 20.0
loss_kw_per_k = 0.0011
daily_draw_kwh = 2.0
draw_shape = [0, 0, 0, 0, 0, 0.5, 3, 4, 2, 1, 0.5, 0.5, 1, 0.5, 0.5, 0.5, 1, 2, 3, 3.5, 2.5, 1.5, 0.5, 0]

# ---- heat pumps (air-to-water) heating a building that stores heat in its mass ------------
# heat_capacity_kwh_per_k and ua_kw_per_k describe the BUILDING and are the biggest
# uncertainty in any result: change them and the optimiser's gain changes a lot.
# COP = cop_at_7c + cop_slope_per_k * (outdoor - 7), clipped to [cop_min, cop_max].

[heatpump.heat_pump_efficient_house]
description = "Air heat pump, well-insulated house: UA 0.12 kW/K, 10 kWh/K, 6 kW heat, band 20-22 C"
heat_capacity_kwh_per_k = 10.0
ua_kw_per_k = 0.12
max_heat_kw = 6.0
t_min_c = 20.0
t_max_c = 22.0
t_initial_c = 21.0
cop_at_7c = 3.5
cop_slope_per_k = 0.07
cop_min = 1.8
cop_max = 5.0

[heatpump.heat_pump_older_house]
description = "Air heat pump, older house: UA 0.25 kW/K, 15 kWh/K, 10 kW heat, band 20-22 C"
heat_capacity_kwh_per_k = 15.0
ua_kw_per_k = 0.25
max_heat_kw = 10.0
t_min_c = 20.0
t_max_c = 22.0
t_initial_c = 21.0
cop_at_7c = 3.2
cop_slope_per_k = 0.07
cop_min = 1.8
cop_max = 4.8
