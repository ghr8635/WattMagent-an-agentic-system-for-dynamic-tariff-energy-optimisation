[project]
name = "wattmagent"
version = "0.1.0"
description = "WattMagent: an agentic system for dynamic-tariff energy optimisation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "tzdata>=2024.1",  # time zone database; Windows has none built in
    "numpy>=1.26",
    "scipy>=1.11",  # HiGHS mixed-integer solver for the optimiser
    "langgraph>=0.2",  # agent orchestration
]

[project.optional-dependencies]
# Added when the steps that need them start (forecasting, agent graph):
#   ml   -> lightgbm, pandas      (forecasting)
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff~=0.16.9",  # pinned: local and CI must lint with the same major.minor
    "mypy>=1.10",
    "pre-commit>=3.7",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wattmagent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "src/wattmagent/core",
    "src/wattmagent/llm",
    "src/wattmagent/data",
    "src/wattmagent/devices",
    "src/wattmagent/planning",
    "src/wattmagent/optimiser",
    "src/wattmagent/safety",
    "src/wattmagent/graph",
    "src/wattmagent/tariff",
    "src/wattmagent/backtest",
    "src/wattmagent/api",
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true  # scipy ships no type information

[[tool.mypy.overrides]]
# The thin LangGraph adapter is not strictly type-checked: its generics are awkward to
# annotate. It is covered by a parity test against the plain runner instead.
module = ["wattmagent.graph.langgraph_app"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Gate starts modest and gets raised as the code base grows.
addopts = "-q --cov=wattmagent --cov-report=term-missing --cov-fail-under=70"
